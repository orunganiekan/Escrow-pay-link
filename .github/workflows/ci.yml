name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder values so Prisma generate, next build and the offline E2E
      # suite run without real services. No secrets are needed for CI.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:1/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@127.0.0.1:1/ci
      NEXT_PUBLIC_APP_URL: http://localhost:3100
      NEON_AUTH_BASE_URL: http://127.0.0.1:1/auth
      NEON_AUTH_COOKIE_SECRET: ci-cookie-secret-ci-cookie-secret-ci-cookie
      ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      PAYSTACK_SECRET_KEY: sk_test_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
